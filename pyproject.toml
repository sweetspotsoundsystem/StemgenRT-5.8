[project]
name = "StemgenRT"
version = "0.6.2"
description = "StemgenRT-5.8 streaming music separation, training and export"
authors = [{ name = "Phil Wang", email = "lucidrains@gmail.com" }]
maintainers = [{ name = "Axel Delafosse" }]
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["music separation", "streaming", "deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/sweetspotsoundsystem/StemgenRT-5.8"

[project.optional-dependencies]
streaming = ["onnxruntime==1.26.0", "soundfile>=0.12"]
training = ["torch==2.8.0", "soundfile>=0.12"]
teacher = ["torch==2.8.0", "torchaudio==2.8.0", "julius==0.2.7", "demucs @ https://github.com/facebookresearch/demucs/archive/e976d93ecc3865e5757426930257e200846a520a.zip"]
onnx = ["torch==2.8.0", "onnx==1.19.1", "onnxruntime==1.26.0"]
test = ["pytest>=8"]

[project.scripts]
stemgenrt-train = "stemgenrt.trainer:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["stemgenrt"]

[tool.hatch.build.targets.sdist]
include = [
    "stemgenrt", "README.md", "LICENSE", "pyproject.toml", "docs", "CONTRIBUTING.md",
    "configs", "scripts", "tests", "models/README.md", "examples", "train_streaming.py",
]
exclude = ["research", "runs", "models/*.onnx", "models/*.pt", "**/__pycache__", "**/*.pyc"]
